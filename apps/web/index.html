<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/companion-icon-192.png" />
    <link rel="apple-touch-icon" href="/companion-icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#1d4ed8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
       — all font families (Plus Jakarta Sans, Inter, JetBrains Mono,
      Source Serif 4) are self-hosted through the bundled fontsource
      packages (see styles/fonts.css), so no font CDN host appears in the
      CSP and packaged or disconnected devices never fetch fonts remotely.
    -->
    <!--
       — meta CSP covers static-host deployments that strip
      response headers. `frame-ancestors` is intentionally omitted from
      meta because browsers ignore the directive in that delivery
      channel; server-side helmet emits it on every response header.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; base-uri 'self'; object-src 'none'; connect-src 'self' http://localhost:8090 http://127.0.0.1:8090 ws://localhost:3000 ws://127.0.0.1:3000; img-src 'self' data: blob: https:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' blob:; worker-src 'self' blob:;"
    />
    <title>Puntovivo - POS Solutions</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
