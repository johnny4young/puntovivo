appId: com.puntovivo.pos
productName: Puntovivo
executableName: puntovivo
# package.json pins electron with a caret range; electron-builder needs the exact
# release to fetch its platform binaries. Keep in sync with the electron devDep.
electronVersion: 43.4.1
# The auto-update feed (latest*.yml) is self-hosted on GitHub Pages: this generic
# provider embeds that base URL into app-update.yml so the packaged app's
# electron-updater fetches the feed from github.io. The installers themselves are
# too large for Pages (100 MB cap) and stay on GitHub Releases, so release.yml
# runs scripts/rewrite-update-feed.mjs to point the feed's binary URLs at the
# absolute Release download URLs before publishing the .yml to Pages. The upload
# is always --publish never - release.yml ships everything itself.
publish:
  provider: generic
  url: https://johnny4young.github.io/puntovivo/
directories:
  output: out-builder
  # default is build/, which the root .gitignore excludes; use a tracked dir so
  # the macOS entitlements plist ships in the repo.
  buildResources: build-resources
# main/preload are built separately by scripts/build-electron-main.mjs into
# .vite/build (package.json "main" points there); electron-builder only packages.
files:
  - .vite/build/**
  # Sandboxed BrowserWindows resolve their full or Customer Display-specific
  # preload from .vite/preload. Packaging only the main bundle leaves the
  # contextBridge absent even though Electron and the embedded server boot.
  - .vite/preload/**
  - package.json
  # Asar dedup: scripts/build-electron-main.mjs inlines the entire server graph
  # (@puntovivo/server + its pure-JS deps) into .vite/build, so the prod
  # node_modules copies electron-builder would otherwise bundle are dead weight.
  # The packages below are statically inlined (verified: zero runtime require()
  # of them across .vite/build/*.cjs) and have no dynamic-require consumer, so
  # excluding their node_modules trees is safe. @puntovivo/server also ships its
  # migrations via extraResources (Resources/migrations), the only path the
  # packaged runtime reads (MIGRATIONS_PATH in main/index.ts) — the asar copy is
  # never loaded. KEPT on purpose: better-sqlite3 / argon2 (vite externals,
  # native), fastify / ajv / fast-json-stringify / fast-querystring / sonic-boom /
  # pako / @aws-sdk / @smithy (runtime require()d by the bundle), and @sentry +
  # @opentelemetry (Sentry's DSN-gated init dynamically require()s the OTel
  # instrumentation, which the boot smoke cannot exercise — keep both).
  - '!node_modules/@puntovivo/server/**'
  - '!node_modules/drizzle-orm/**'
  - '!node_modules/@ai-sdk/**'
  - '!node_modules/ai/**'
  - '!node_modules/zod/**'
  - '!node_modules/@trpc/**'
  - '!node_modules/dayjs/**'
# Pin a flat, predictable artifact name on every platform. Without it the linux
# zip target falls back to the scoped package name (@puntovivo/desktop-x.y.z.zip),
# which nests the file under out-builder/@puntovivo/ and slips past the
# non-recursive out-builder/*.zip upload glob.
artifactName: ${productName}-${version}-${os}-${arch}.${ext}
asar: true
# .node addons cannot be dlopen'd from inside app.asar.
asarUnpack:
  - '**/*.node'
# v13 bundles eight Node-API binaries. Keep only the current native target in
# the finished app so portability does not add roughly 22 MB of dead addons to
# every installer; the hook fails closed if the expected binary is absent.
# The hook must live INSIDE this project dir: electron-builder rejects
# relative hook paths above its detected workspace root, and on Windows
# that detection falls back to apps/desktop. The wrapper re-exports the
# real script from the repo root.
afterPack: ./scripts/prune-native-prebuilds.mjs
extraResources:
  - from: ../web/dist
    to: dist
  - from: ../../packages/server/dist/db/migrations
    to: migrations
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  grantFileProtocolExtraPrivileges: false
mac:
  # Puntovivo desktop intentionally supports the current two validated macOS
  # generations on Apple Silicon: Sequoia 15 and Tahoe 26. Keep this aligned
  # with the pinned manual workflow matrix. Intel requires a separate artifact
  # and native-module proof; do not imply it from the OS version alone.
  minimumSystemVersion: '15.0'
  # Keep one lossless source and let electron-builder's pinned icon converter
  # produce the platform-native ICNS. This avoids committing opaque,
  # hand-generated derivatives that can drift from the tracked SVG/PNG source.
  icon: build-resources/icon.png
  target:
    - zip
  category: public.app-category.business
  hardenedRuntime: true
  entitlements: build-resources/entitlements.mac.plist
  entitlementsInherit: build-resources/entitlements.mac.plist
  # Notarization is opt-in at the workflow level: the release job enables it via
  # -c.mac.notarize=true only when the Apple secrets are present (electron-builder
  # reads APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID from the env).
  notarize: false
# Target formats are dictated by electron-updater's auto-install support: mac
# updates from a zip (Squirrel.Mac), windows needs an NSIS installer, linux needs
# an AppImage. A plain zip cannot auto-install on windows/linux, so those two
# ship their updater-native format and the zip stays mac-only.
linux:
  icon: build-resources/icon.png
  # Keep the .desktop entry and runtime window class aligned so GNOME/KDE can
  # associate a running register with its launcher and taskbar icon.
  syncDesktopName: true
  category: Office
  target:
    - AppImage
win:
  # The same source is converted to ICO by electron-builder. Supplying the PNG
  # here also keeps Windows and macOS branding pixel-identical.
  icon: build-resources/icon.png
  # There is no Authenticode certificate yet, so a downloaded installer has no
  # signature for electron-updater to verify and the app refuses to install a
  # Windows update on quit (main/auto-updater/install-policy.ts).
  #
  # When a certificate lands: supplying CSC_LINK / CSC_KEY_PASSWORD is enough
  # for electron-builder to write the publisher into app-update.yml on its own
  # (it derives it from the certificate subject). An explicit override belongs
  # under `win.signtoolOptions.publisherName` — a bare `win.publisherName` is
  # NOT a valid key in electron-builder 26 and fails config validation. Then,
  # and only after a packaged Windows smoke proves the signature is actually
  # checked, flip win32 to verified in install-policy.ts.
  target:
    - nsis
nsis:
  # Per-user install (no UAC elevation) so the silent electron-updater install
  # works without a prompt; one-click keeps the manual download a simple
  # double-click-and-go installer too.
  oneClick: true
  perMachine: false
