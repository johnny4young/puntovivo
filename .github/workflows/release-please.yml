name: release-please

# Automated versioning + changelog from Conventional Commits, with artifact build.
#
# On every push to main, release-please opens/updates a "Release PR" that
# accumulates the commits since the last release, bumps the version (lock-step
# across the 4 package.json files via release-please-config.json extra-files),
# and prepends the generated notes to CHANGELOG.md. Merging the Release PR
# creates the vX.Y.Z tag + a GitHub Release; the curate-release-notes job then
# replaces that technical body with docs/releases/vX.Y.Z.md from the exact tag.
#
# When that release is created, the build-artifacts job invokes the reusable
# release.yml (workflow_call) with the new tag to build and upload the web +
# desktop installers onto the release. Running release.yml as a reusable
# workflow in the same run means no PAT is needed — a bot-created release event
# would not, by itself, trigger a separate workflow.
#
# While a Release PR is open, the release-notes-gate job posts a "Curated release
# notes" commit status on it after every push to main: failure while main has no
# valid docs/releases/vX.Y.Z.md for the version the PR proposes, success once it
# does. The PR's own CI cannot report that unattended, because GitHub holds the
# workflow runs of github-actions[bot] commits until a maintainer approves them.

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Release PR / tag
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      pr_branch: ${{ steps.release.outputs.pr && fromJSON(steps.release.outputs.pr).headBranchName }}
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build-artifacts:
    name: Build & upload release artifacts
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    # The called release.yml uploads the installers (contents) AND publishes the
    # auto-update feed to GitHub Pages; a reusable workflow's jobs cannot exceed
    # the permissions the caller grants, so pages + id-token are granted here.
    permissions:
      contents: write
      pages: write
      id-token: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
    secrets: inherit

  curate-release-notes:
    name: Publish human release notes
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the released tag
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - name: Replace generated notes with the curated release story
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/publish-human-release-notes.mjs "${{ needs.release-please.outputs.tag_name }}"

  # A merge commit carries its PR title in the body, so release-please lists
  # every merged PR twice.
  dedupe-changelog:
    name: Drop repeated changelog entries on the Release PR
    needs: release-please
    if: ${{ needs.release-please.outputs.pr_branch != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Check out the Release PR branch
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.pr_branch }}
      - name: Remove duplicates and push
        run: |
          node scripts/dedupe-changelog.mjs CHANGELOG.md
          if git diff --quiet -- CHANGELOG.md; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: drop repeated changelog entries' -- CHANGELOG.md
          git push origin HEAD

  release-notes-gate:
    name: Curated notes status on the Release PR
    needs: [release-please, dedupe-changelog]
    # Runs after the dedupe push so the status lands on the final head.
    if: ${{ !cancelled() && needs.release-please.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    steps:
      - name: Check out the pushed commit
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Post the curated notes status on the open Release PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-notes-gate.mjs
