name: Build Desktop (manual)

# ============================================================================
# Manual cross-OS desktop build
# ----------------------------------------------------------------------------
# Triggered exclusively by the operator via workflow_dispatch when they want
# to validate or produce a desktop build for a chosen subset of platforms.
# The push/PR `desktop` job in `.github/workflows/ci.yml` validates on
# ubuntu-latest and windows-latest; macOS validation and packaging on every OS
# stay here, on demand.
#
# Modes:
# - validate_only: runs `pnpm run ci:desktop` per chosen OS (no packaging).
# ~5-8 minutes per OS.
# - full build:    runs `make:desktop` per chosen OS, smoke-tests the packaged
# app, and uploads both artifacts and a checksummed candidate-evidence manifest.
# Distribution trust is reported from each host's native tooling but not gated
# here: manual artifacts are intentionally unsigned. release.yml owns the
# signed trust gate. Use this when you want an immutable cross-OS candidate proof.
# ~10-20 minutes per OS.
#
# Reference: release.yml's `release-desktop` job uses the same matrix
# include shape; this workflow mirrors it but without tag/upload steps.
# ============================================================================

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: 'Immutable 40-character commit SHA to validate/package'
        type: string
        required: true
      linux:
        description: 'Build on ubuntu-latest (Linux)'
        type: boolean
        default: true
      mac:
        description: 'Build on macOS 15 Sequoia and macOS 26 Tahoe arm64 — bills at 10x each'
        type: boolean
        default: false
      win:
        description: 'Build on windows-latest (Windows)'
        type: boolean
        default: false
      soak:
        description: 'Run the 20-minute desktop soak on windows-latest (no packaging needed)'
        type: boolean
        default: false
      validate_only:
        description: 'validate_only=true skips packaging (faster, no artifacts)'
        type: boolean
        default: false

env:
  # The Electron line the last release shipped. Raise it after each runtime release.
  PREVIOUS_ELECTRON: 43.8.3
  # The last release; the safeStorage proof seals and rolls back with its key store.
  # Raise it after each release.
  PREVIOUS_RELEASE: v1.15.6
  GIT_CONFIG_COUNT: '2'
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main
  GIT_CONFIG_KEY_1: advice.detachedHead
  GIT_CONFIG_VALUE_1: 'false'

# Per-job concurrency: cancel any in-progress run for the same actor when
# they kick off another. Avoids stacking macOS minutes when an operator
# triggers the workflow twice in a row by accident.
concurrency:
  group: build-desktop-${{ github.actor }}
  cancel-in-progress: true

jobs:
  verify-candidate:
    name: Verify immutable candidate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.candidate.outputs.sha }}
      short_sha: ${{ steps.candidate.outputs.short_sha }}
    steps:
      - name: Checkout candidate SHA
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.candidate_sha }}

      - name: Require exact checked-out SHA
        id: candidate
        shell: bash
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -euo pipefail
          if [[ ! "$CANDIDATE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "candidate_sha must be a complete 40-character commit SHA" >&2
            exit 1
          fi
          ACTUAL_SHA=$(git rev-parse HEAD)
          if [[ "${ACTUAL_SHA,,}" != "${CANDIDATE_SHA,,}" ]]; then
            echo "checked-out HEAD $ACTUAL_SHA does not match requested candidate $CANDIDATE_SHA" >&2
            exit 1
          fi
          echo "sha=${ACTUAL_SHA,,}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${ACTUAL_SHA:0:12}" >> "$GITHUB_OUTPUT"

  build-linux:
    needs: verify-candidate
    if: ${{ inputs.linux }}
    name: Build Linux (${{ needs.verify-candidate.outputs.short_sha }})
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.verify-candidate.outputs.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          check-latest: true

      - name: Setup pnpm
        shell: bash
        run: |
          pnpmVersion="$(node -p "require('./package.json').packageManager.replace('pnpm@', '')")"
          npm install --global "pnpm@$pnpmVersion" --ignore-scripts --no-audit --no-fund
          test "$(pnpm --version)" = "$pnpmVersion"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y dbus-x11 xvfb python3-dbus python3-gi libgtk-3-dev libwebkit2gtk-4.1-dev librsvg2-dev fakeroot rpm
          sudo apt-get install -y libasound2t64 || sudo apt-get install -y libasound2

      # Electron 42+ no longer downloads its runtime during package installation.
      # Fetch the exact release zip and extract it with the OS-native tool
      # (unzip on Linux/macOS, bsdtar on Windows), set path.txt, then verify it.
      - name: Ensure Electron runtime
        if: ${{ inputs.validate_only }}
        shell: bash
        run: |
          set -e
          EV=$(node -p "require('./node_modules/electron/package.json').version")
          PLAT=$(node -p "process.platform")
          ARCH=$(node -p "process.arch")
          case "$PLAT" in
            linux)  ZIP="electron-v${EV}-linux-${ARCH}.zip";  BIN="electron" ;;
            darwin) ZIP="electron-v${EV}-darwin-${ARCH}.zip"; BIN="Electron.app/Contents/MacOS/Electron" ;;
            win32)  ZIP="electron-v${EV}-win32-${ARCH}.zip";  BIN="electron.exe" ;;
          esac
          rm -rf node_modules/electron/dist node_modules/electron/path.txt
          mkdir -p node_modules/electron/dist
          curl -fSL --retry 3 "https://github.com/electron/electron/releases/download/v${EV}/${ZIP}" -o "${RUNNER_TEMP}/${ZIP}"
          case "$PLAT" in
            # ditto preserves the .app bundle + symlinks so its signature stays
            # valid; ad-hoc re-sign so ensure:binary's codesign check passes.
            darwin) ditto -x -k "${RUNNER_TEMP}/${ZIP}" node_modules/electron/dist
                    codesign --force --deep --sign - node_modules/electron/dist/Electron.app ;;
            # git-bash tar is GNU tar (no zip support); use PowerShell Expand-Archive.
            win32)  ZW=$(cygpath -w "${RUNNER_TEMP}/${ZIP}"); DW=$(cygpath -w "$PWD/node_modules/electron/dist")
                    powershell -NoProfile -Command "Expand-Archive -LiteralPath '$ZW' -DestinationPath '$DW' -Force" ;;
            *)      unzip -q -o "${RUNNER_TEMP}/${ZIP}" -d node_modules/electron/dist ;;
          esac
          printf '%s' "$BIN" > node_modules/electron/path.txt
          node -e "const p=require('electron'),fs=require('fs');if(typeof p!=='string'||!fs.existsSync(p)){console.error('electron runtime missing:',p);process.exit(1)}console.log('electron runtime OK:',p)"

      - name: Validate desktop workspace
        if: ${{ inputs.validate_only }}
        run: pnpm run ci:desktop

      - name: Validate native Node glob inventory guard
        if: ${{ inputs.validate_only }}
        run: pnpm --filter @puntovivo/server exec vitest run src/__tests__/inventory-reserved-is-unused.test.ts

      - name: Validate native Node glob money guard
        if: ${{ inputs.validate_only }}
        run: pnpm --filter @puntovivo/web exec vitest run src/features/__tests__/money-modal-submit-guard.test.ts

      - name: Build and package desktop app
        if: ${{ !inputs.validate_only }}
        run: |
          node scripts/clean-paths.mjs apps/desktop/out-builder
          pnpm --filter @puntovivo/desktop run make:desktop
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Smoke-test packaged runtime
        if: ${{ !inputs.validate_only }}
        run: |
          sudo chown root:root apps/desktop/out-builder/linux-unpacked/chrome-sandbox
          sudo chmod 4755 apps/desktop/out-builder/linux-unpacked/chrome-sandbox
          # Electron 42+ expects the portal host Registry API newer than ubuntu-latest's ambient service.
          # The wrapper supplies the deterministic startup contract and fails on any portal stderr.
          # Disable MIT-SHM in this disposable X server: Chromium can otherwise race a final
          # Shm::PutImageRequest against the destroyed renderer drawable during clean shutdown.
          xvfb-run -a -s "-screen 0 1280x1024x24 -extension MIT-SHM" dbus-run-session -- node scripts/run-linux-desktop-smoke.mjs --against-packaged apps/desktop/out-builder

      - name: Rehearse packaged encrypted recovery
        if: ${{ !inputs.validate_only }}
        run: >-
          xvfb-run -a -s "-screen 0 1280x1024x24 -extension MIT-SHM" dbus-run-session -- node scripts/run-packaged-recovery-rehearsal.mjs
          --against-packaged apps/desktop/out-builder
          --candidate-sha "${{ needs.verify-candidate.outputs.sha }}"
          --output "apps/desktop/out-builder/packaged-recovery-linux-${{ needs.verify-candidate.outputs.short_sha }}.json"

      # The other gates inject the key or mock the key store; this one reaches the real one.
      - name: Prove safeStorage survives the Electron upgrade
        if: ${{ !inputs.validate_only }}
        run: |
          sudo apt-get install -y gnome-keyring
          git fetch --depth=1 origin "refs/tags/${{ env.PREVIOUS_RELEASE }}:refs/tags/${{ env.PREVIOUS_RELEASE }}"
          xvfb-run -a dbus-run-session -- bash -c "printf proof | gnome-keyring-daemon --unlock --components=secrets > /dev/null && node scripts/verify-safe-storage-upgrade.mjs --from '${{ env.PREVIOUS_ELECTRON }}' --from-ref '${{ env.PREVIOUS_RELEASE }}' --output 'apps/desktop/out-builder/safe-storage-upgrade-${{ needs.verify-candidate.outputs.short_sha }}.json'"

      - name: Collect candidate evidence
        if: ${{ !inputs.validate_only }}
        shell: bash
        run: |
          set -euo pipefail
          host_os_version="$(node -p 'require("node:os").release()')"
          node scripts/collect-desktop-candidate-evidence.mjs \
            --candidate-sha "${{ needs.verify-candidate.outputs.sha }}" \
            --structure-smoke passed \
            --runtime-smoke passed \
            --renderer-smoke passed \
            --host-os-version "$host_os_version" \
            --support-target linux-x64-current \
            --recovery-evidence "apps/desktop/out-builder/packaged-recovery-linux-${{ needs.verify-candidate.outputs.short_sha }}.json" \
            --output "apps/desktop/out-builder/candidate-evidence-linux-${{ needs.verify-candidate.outputs.short_sha }}.json"

      - name: Upload Linux artifacts
        if: ${{ !cancelled() && !inputs.validate_only }}
        uses: actions/upload-artifact@v7
        with:
          name: desktop-linux-${{ needs.verify-candidate.outputs.short_sha }}
          path: |
            apps/desktop/out-builder/Puntovivo-*
            apps/desktop/out-builder/latest*.yml
            apps/desktop/out-builder/candidate-evidence-*.json
            apps/desktop/out-builder/packaged-recovery-*.json
            apps/desktop/out-builder/safe-storage-upgrade-*.json
          if-no-files-found: error
          retention-days: 7

  # Twenty minutes of sales, injected server-worker crashes and scheduled
  # backups against the built app; docs/TESTING.md lists what it must prove.
  soak-win:
    needs: verify-candidate
    if: ${{ inputs.soak }}
    name: Desktop soak, Windows (${{ needs.verify-candidate.outputs.short_sha }})
    runs-on: windows-latest
    timeout-minutes: 50

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.verify-candidate.outputs.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          check-latest: true

      - name: Setup pnpm
        shell: pwsh
        run: |
          $pnpmVersion = node -p "require('./package.json').packageManager.replace('pnpm@', '')"
          npm install --global "pnpm@$pnpmVersion" --ignore-scripts --no-audit --no-fund
          if ((pnpm --version) -ne $pnpmVersion) {
            throw "pnpm version mismatch"
          }

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Electron 42+ no longer downloads its runtime during package installation.
      - name: Ensure Electron runtime
        shell: bash
        run: |
          set -e
          EV=$(node -p "require('./node_modules/electron/package.json').version")
          ARCH=$(node -p "process.arch")
          ZIP="electron-v${EV}-win32-${ARCH}.zip"
          mkdir -p node_modules/electron/dist
          curl -fSL --retry 3 "https://github.com/electron/electron/releases/download/v${EV}/${ZIP}" -o "${RUNNER_TEMP}/${ZIP}"
          ZW=$(cygpath -w "${RUNNER_TEMP}/${ZIP}"); DW=$(cygpath -w "$PWD/node_modules/electron/dist")
          powershell -NoProfile -Command "Expand-Archive -LiteralPath '$ZW' -DestinationPath '$DW' -Force"
          printf '%s' "electron.exe" > node_modules/electron/path.txt

      - name: Build server, renderer and desktop main
        run: |
          pnpm --filter @puntovivo/server run build
          pnpm --filter @puntovivo/web run build
          pnpm --filter @puntovivo/desktop run build:main

      - name: Run the short soak
        run: pnpm run soak:desktop --profile=short --out=soak-out

      - name: Upload soak evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: desktop-soak-win-${{ needs.verify-candidate.outputs.short_sha }}
          path: soak-out/
          if-no-files-found: warn
          retention-days: 14

  build-mac:
    needs: verify-candidate
    if: ${{ inputs.mac }}
    name: Build macOS ${{ matrix.name }} (${{ needs.verify-candidate.outputs.short_sha }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            name: Sequoia 15 arm64
            expected_major: '15'
            support_target: macos-15-sequoia-arm64
            evidence_suffix: sequoia
          - os: macos-26
            name: Tahoe 26 arm64
            expected_major: '26'
            support_target: macos-26-tahoe-arm64
            evidence_suffix: tahoe

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.verify-candidate.outputs.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          check-latest: true

      - name: Verify pinned macOS support target
        shell: bash
        env:
          EXPECTED_MACOS_MAJOR: ${{ matrix.expected_major }}
        run: |
          set -euo pipefail
          actual_version="$(sw_vers -productVersion)"
          if [[ "$actual_version" != "${EXPECTED_MACOS_MAJOR}."* ]]; then
            echo "expected macOS ${EXPECTED_MACOS_MAJOR}.x, got ${actual_version}" >&2
            exit 1
          fi
          echo "validated host: macOS ${actual_version} ($(uname -m))"
          test "$(uname -m)" = arm64

      - name: Setup pnpm
        shell: bash
        run: |
          pnpmVersion="$(node -p "require('./package.json').packageManager.replace('pnpm@', '')")"
          npm install --global "pnpm@$pnpmVersion" --ignore-scripts --no-audit --no-fund
          test "$(pnpm --version)" = "$pnpmVersion"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Electron 42+ no longer downloads its runtime during package installation.
      # Fetch the exact release zip and extract it with the OS-native tool
      # (unzip on Linux/macOS, bsdtar on Windows), set path.txt, then verify it.
      - name: Ensure Electron runtime
        if: ${{ inputs.validate_only }}
        shell: bash
        run: |
          set -e
          EV=$(node -p "require('./node_modules/electron/package.json').version")
          PLAT=$(node -p "process.platform")
          ARCH=$(node -p "process.arch")
          case "$PLAT" in
            linux)  ZIP="electron-v${EV}-linux-${ARCH}.zip";  BIN="electron" ;;
            darwin) ZIP="electron-v${EV}-darwin-${ARCH}.zip"; BIN="Electron.app/Contents/MacOS/Electron" ;;
            win32)  ZIP="electron-v${EV}-win32-${ARCH}.zip";  BIN="electron.exe" ;;
          esac
          rm -rf node_modules/electron/dist node_modules/electron/path.txt
          mkdir -p node_modules/electron/dist
          curl -fSL --retry 3 "https://github.com/electron/electron/releases/download/v${EV}/${ZIP}" -o "${RUNNER_TEMP}/${ZIP}"
          case "$PLAT" in
            # ditto preserves the .app bundle + symlinks so its signature stays
            # valid; ad-hoc re-sign so ensure:binary's codesign check passes.
            darwin) ditto -x -k "${RUNNER_TEMP}/${ZIP}" node_modules/electron/dist
                    codesign --force --deep --sign - node_modules/electron/dist/Electron.app ;;
            # git-bash tar is GNU tar (no zip support); use PowerShell Expand-Archive.
            win32)  ZW=$(cygpath -w "${RUNNER_TEMP}/${ZIP}"); DW=$(cygpath -w "$PWD/node_modules/electron/dist")
                    powershell -NoProfile -Command "Expand-Archive -LiteralPath '$ZW' -DestinationPath '$DW' -Force" ;;
            *)      unzip -q -o "${RUNNER_TEMP}/${ZIP}" -d node_modules/electron/dist ;;
          esac
          printf '%s' "$BIN" > node_modules/electron/path.txt
          node -e "const p=require('electron'),fs=require('fs');if(typeof p!=='string'||!fs.existsSync(p)){console.error('electron runtime missing:',p);process.exit(1)}console.log('electron runtime OK:',p)"

      - name: Validate desktop workspace
        if: ${{ inputs.validate_only }}
        run: pnpm run ci:desktop

      - name: Validate native Node glob inventory guard
        if: ${{ inputs.validate_only }}
        run: pnpm --filter @puntovivo/server exec vitest run src/__tests__/inventory-reserved-is-unused.test.ts

      - name: Validate native Node glob money guard
        if: ${{ inputs.validate_only }}
        run: pnpm --filter @puntovivo/web exec vitest run src/features/__tests__/money-modal-submit-guard.test.ts

      - name: Build and package desktop app
        if: ${{ !inputs.validate_only }}
        run: |
          node scripts/clean-paths.mjs apps/desktop/out-builder
          pnpm --filter @puntovivo/desktop run prebuild:desktop
          pnpm --filter @puntovivo/desktop run native:ensure:electron
          pnpm --filter @puntovivo/desktop exec electron-builder --mac --publish never -c.mac.identity=-
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Smoke-test packaged runtime
        if: ${{ !inputs.validate_only }}
        run: |
          node scripts/run-desktop-smoke.mjs --against-packaged apps/desktop/out-builder
          node scripts/run-desktop-smoke.mjs --against-packaged apps/desktop/out-builder --renderer

      - name: Rehearse packaged encrypted recovery
        if: ${{ !inputs.validate_only }}
        run: >-
          node scripts/run-packaged-recovery-rehearsal.mjs
          --against-packaged apps/desktop/out-builder
          --candidate-sha "${{ needs.verify-candidate.outputs.sha }}"
          --output "apps/desktop/out-builder/packaged-recovery-mac-${{ matrix.evidence_suffix }}-${{ needs.verify-candidate.outputs.short_sha }}.json"

      # The other gates inject the key or mock the key store; this one reaches the real one.
      # A throwaway default keychain with a known password lets the proof clear the
      # Keychain dialog that would otherwise wait for a person.
      - name: Prove safeStorage survives the Electron upgrade
        if: ${{ !inputs.validate_only }}
        env:
          PROOF_KEYCHAIN_PASSWORD: safe-storage-proof
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/safe-storage-proof.keychain-db"
          security create-keychain -p "$PROOF_KEYCHAIN_PASSWORD" "$keychain"
          security set-keychain-settings "$keychain"
          security unlock-keychain -p "$PROOF_KEYCHAIN_PASSWORD" "$keychain"
          security list-keychains -d user -s "$keychain" "$HOME/Library/Keychains/login.keychain-db"
          security default-keychain -d user -s "$keychain"
          git fetch --depth=1 origin "refs/tags/${{ env.PREVIOUS_RELEASE }}:refs/tags/${{ env.PREVIOUS_RELEASE }}"
          node scripts/verify-safe-storage-upgrade.mjs --from "${{ env.PREVIOUS_ELECTRON }}" --from-ref "${{ env.PREVIOUS_RELEASE }}" --output "apps/desktop/out-builder/safe-storage-upgrade-${{ needs.verify-candidate.outputs.short_sha }}.json"

      - name: Collect candidate evidence
        if: ${{ !inputs.validate_only }}
        shell: bash
        run: |
          set -euo pipefail
          host_os_version="$(sw_vers -productVersion)"
          node scripts/collect-desktop-candidate-evidence.mjs \
            --candidate-sha "${{ needs.verify-candidate.outputs.sha }}" \
            --structure-smoke passed \
            --runtime-smoke passed \
            --renderer-smoke passed \
            --host-os-version "$host_os_version" \
            --support-target "${{ matrix.support_target }}" \
            --recovery-evidence "apps/desktop/out-builder/packaged-recovery-mac-${{ matrix.evidence_suffix }}-${{ needs.verify-candidate.outputs.short_sha }}.json" \
            --output "apps/desktop/out-builder/candidate-evidence-mac-${{ matrix.evidence_suffix }}-${{ needs.verify-candidate.outputs.short_sha }}.json"

      - name: Upload macOS artifacts
        if: ${{ !cancelled() && !inputs.validate_only }}
        uses: actions/upload-artifact@v7
        with:
          name: desktop-mac-${{ matrix.evidence_suffix }}-${{ needs.verify-candidate.outputs.short_sha }}
          path: |
            apps/desktop/out-builder/Puntovivo-*
            apps/desktop/out-builder/latest*.yml
            apps/desktop/out-builder/candidate-evidence-*.json
            apps/desktop/out-builder/packaged-recovery-*.json
            apps/desktop/out-builder/safe-storage-upgrade-*.json
          if-no-files-found: error
          retention-days: 7

  build-win:
    needs: verify-candidate
    if: ${{ inputs.win }}
    name: Build Windows (${{ needs.verify-candidate.outputs.short_sha }})
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.verify-candidate.outputs.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          check-latest: true

      # The regular pnpm package is pure JavaScript and needs no install
      # scripts. This also avoids pnpm/action-setup v6's Node 24 DEP0190 path;
      # @pnpm/exe is deliberately not used because its preinstall materializes
      # the binary.
      - name: Setup pnpm
        shell: pwsh
        run: |
          $pnpmVersion = node -p "require('./package.json').packageManager.replace('pnpm@', '')"
          npm install --global "pnpm@$pnpmVersion" --ignore-scripts --no-audit --no-fund
          if ((pnpm --version) -ne $pnpmVersion) {
            throw "pnpm version mismatch"
          }

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Electron 42+ no longer downloads its runtime during package installation.
      # Fetch the exact release zip and extract it with the OS-native tool
      # (unzip on Linux/macOS, bsdtar on Windows), set path.txt, then verify it.
      - name: Ensure Electron runtime
        if: ${{ inputs.validate_only }}
        shell: bash
        run: |
          set -e
          EV=$(node -p "require('./node_modules/electron/package.json').version")
          PLAT=$(node -p "process.platform")
          ARCH=$(node -p "process.arch")
          case "$PLAT" in
            linux)  ZIP="electron-v${EV}-linux-${ARCH}.zip";  BIN="electron" ;;
            darwin) ZIP="electron-v${EV}-darwin-${ARCH}.zip"; BIN="Electron.app/Contents/MacOS/Electron" ;;
            win32)  ZIP="electron-v${EV}-win32-${ARCH}.zip";  BIN="electron.exe" ;;
          esac
          rm -rf node_modules/electron/dist node_modules/electron/path.txt
          mkdir -p node_modules/electron/dist
          curl -fSL --retry 3 "https://github.com/electron/electron/releases/download/v${EV}/${ZIP}" -o "${RUNNER_TEMP}/${ZIP}"
          case "$PLAT" in
            # ditto preserves the .app bundle + symlinks so its signature stays
            # valid; ad-hoc re-sign so ensure:binary's codesign check passes.
            darwin) ditto -x -k "${RUNNER_TEMP}/${ZIP}" node_modules/electron/dist
                    codesign --force --deep --sign - node_modules/electron/dist/Electron.app ;;
            # git-bash tar is GNU tar (no zip support); use PowerShell Expand-Archive.
            win32)  ZW=$(cygpath -w "${RUNNER_TEMP}/${ZIP}"); DW=$(cygpath -w "$PWD/node_modules/electron/dist")
                    powershell -NoProfile -Command "Expand-Archive -LiteralPath '$ZW' -DestinationPath '$DW' -Force" ;;
            *)      unzip -q -o "${RUNNER_TEMP}/${ZIP}" -d node_modules/electron/dist ;;
          esac
          printf '%s' "$BIN" > node_modules/electron/path.txt
          node -e "const p=require('electron'),fs=require('fs');if(typeof p!=='string'||!fs.existsSync(p)){console.error('electron runtime missing:',p);process.exit(1)}console.log('electron runtime OK:',p)"

      - name: Validate desktop workspace
        if: ${{ inputs.validate_only }}
        run: pnpm run ci:desktop

      - name: Validate native Node glob inventory guard
        if: ${{ inputs.validate_only }}
        run: pnpm --filter @puntovivo/server exec vitest run src/__tests__/inventory-reserved-is-unused.test.ts

      - name: Validate native Node glob money guard
        if: ${{ inputs.validate_only }}
        run: pnpm --filter @puntovivo/web exec vitest run src/features/__tests__/money-modal-submit-guard.test.ts

      - name: Build and package desktop app
        if: ${{ !inputs.validate_only }}
        run: |
          node scripts/clean-paths.mjs apps/desktop/out-builder
          pnpm --filter @puntovivo/desktop run make:desktop
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Smoke-test packaged runtime
        if: ${{ !inputs.validate_only }}
        run: |
          node scripts/run-desktop-smoke.mjs --against-packaged apps/desktop/out-builder
          node scripts/run-desktop-smoke.mjs --against-packaged apps/desktop/out-builder --renderer

      - name: Rehearse packaged encrypted recovery
        if: ${{ !inputs.validate_only }}
        run: >-
          node scripts/run-packaged-recovery-rehearsal.mjs
          --against-packaged apps/desktop/out-builder
          --candidate-sha "${{ needs.verify-candidate.outputs.sha }}"
          --output "apps/desktop/out-builder/packaged-recovery-win-${{ needs.verify-candidate.outputs.short_sha }}.json"

      # The other gates inject the key or mock the key store; this one reaches the real one.
      - name: Prove safeStorage survives the Electron upgrade
        if: ${{ !inputs.validate_only }}
        run: git fetch --depth=1 origin "refs/tags/${{ env.PREVIOUS_RELEASE }}:refs/tags/${{ env.PREVIOUS_RELEASE }}" && node scripts/verify-safe-storage-upgrade.mjs --from "${{ env.PREVIOUS_ELECTRON }}" --from-ref "${{ env.PREVIOUS_RELEASE }}" --output "apps/desktop/out-builder/safe-storage-upgrade-${{ needs.verify-candidate.outputs.short_sha }}.json"

      - name: Collect candidate evidence
        if: ${{ !inputs.validate_only }}
        shell: bash
        run: |
          set -euo pipefail
          host_os_version="$(node -p 'require("node:os").release()')"
          node scripts/collect-desktop-candidate-evidence.mjs \
            --candidate-sha "${{ needs.verify-candidate.outputs.sha }}" \
            --structure-smoke passed \
            --runtime-smoke passed \
            --renderer-smoke passed \
            --host-os-version "$host_os_version" \
            --support-target windows-x64-current \
            --recovery-evidence "apps/desktop/out-builder/packaged-recovery-win-${{ needs.verify-candidate.outputs.short_sha }}.json" \
            --output "apps/desktop/out-builder/candidate-evidence-win-${{ needs.verify-candidate.outputs.short_sha }}.json"

      - name: Upload Windows artifacts
        if: ${{ !cancelled() && !inputs.validate_only }}
        uses: actions/upload-artifact@v7
        with:
          name: desktop-win-${{ needs.verify-candidate.outputs.short_sha }}
          path: |
            apps/desktop/out-builder/Puntovivo-*
            apps/desktop/out-builder/latest*.yml
            apps/desktop/out-builder/candidate-evidence-*.json
            apps/desktop/out-builder/packaged-recovery-*.json
            apps/desktop/out-builder/safe-storage-upgrade-*.json
          if-no-files-found: error
          retention-days: 7
